<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire Risk Assessor</title>

  <!-- Install / home-screen support -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b3261e">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fire Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.4; }
    input[type=text] { font: inherit; padding: 10px; width: 100%; box-sizing: border-box; }
    button, .btn { font: inherit; padding: 12px 20px; margin-top: 8px; cursor: pointer; display: inline-block; }
    .btn { border: 1px solid #767676; border-radius: 4px; background: #efefef; }
    .link-btn { background: none; border: none; color: #b00020; padding: 4px 0; margin: 0; }
    .muted { color: #555; font-size: 0.9rem; }
    ul.items { list-style: none; padding: 0; }
    ul.items li { border: 1px solid #bbb; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    ul.items a { font-weight: 600; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 0; list-style: none; }
    .grid li { border: 1px solid #bbb; border-radius: 6px; padding: 8px; }
    .grid img { width: 100%; height: auto; display: block; border-radius: 4px; }
    .back { display: inline-block; margin-bottom: 8px; }
    #photo-input { display: none; } /* the label below acts as the visible button */

    /* Tags */
    details { margin: 8px 0; }
    summary { cursor: pointer; padding: 6px 0; font-size: 0.95rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .chip { margin: 0; padding: 8px 12px; border: 1px solid #767676; border-radius: 999px; background: #fff; font-size: 0.9rem; }
    .chip[aria-pressed="true"] { background: #1a4f8b; border-color: #1a4f8b; color: #fff; }

    /* Notes and voice */
    textarea { font: inherit; width: 100%; box-sizing: border-box; padding: 8px; min-height: 70px; margin-top: 6px; }
    .voice { margin-top: 8px; }
    .voice audio { width: 100%; margin-top: 6px; }
    .recording { background: #b00020; border-color: #b00020; color: #fff; }
  </style>
</head>
<body>
  <main id="app"></main>
  <p id="sync-badge" class="muted"></p>

  <!-- Dexie now loads from your own folder (see the PowerShell download command) -->
  <script src="dexie.min.js"></script>
  <script>
    // ===============================================================
    // 1. DATABASE
    // Three tables, linked by ID numbers (like foreign keys in SQL):
    //   assessments : one per building/site visit
    //   sections    : areas inside an assessment (a door, stairwell...)
    //                 "assessmentId" says which assessment it belongs to
    //   photos      : pictures inside a section
    //                 "sectionId" says which section it belongs to
    // New database name, so it doesn't clash with step 1's data.
    // ===============================================================
    if (typeof Dexie === "undefined") {
      document.getElementById("app").textContent =
        "dexie.min.js was not found. Download it into the same folder as this page.";
      throw new Error("Dexie missing");
    }
    // A NEW database name again, because photos and audio are now stored in
    // a different shape (see below). Test data from earlier versions stays
    // in the old databases and is simply no longer used.
    //
    // Photos and audio are stored as raw bytes (an ArrayBuffer plus the file
    // type) rather than as a Blob. Safari on iPhone is unreliable at reading
    // Blobs back out of IndexedDB (missing images, silent audio). Plain
    // bytes always read back correctly, and we turn them into a Blob only
    // when we need to display or play them.
    //
    // Every record now has:
    //   id          a UUID (text) made on the device, unique everywhere
    //   updatedAt   when it last changed
    //   syncStatus  "pending" (needs uploading) or "synced"
    //   deleted     true = removed by the user; kept until the server knows
    const db = new Dexie("fireRiskAssessorV3");
    db.version(1).stores({
      assessments: "id, created, syncStatus",
      sections:    "id, assessmentId, created, syncStatus",
      photos:      "id, sectionId, created, syncStatus, *tags",
      voiceNotes:  "id, photoId, created, syncStatus",
      customTags:  "name"
    });

    // Ask the browser not to delete our data when the device is short of
    // space. It may refuse, which is fine - it's a request, not a demand.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // ===============================================================
    // 1b. RECORD HELPERS
    // All saving, changing and deleting goes through these four functions,
    // so every record is stamped the same way and is flagged "pending"
    // whenever it changes. The sync step (6d) will upload the pending ones.
    // ===============================================================

    // A UUID looks like "3f2b8c1e-9d4a-4e0b-a7c1-5b2f6d8e9a10". Two devices
    // can make IDs without ever clashing, even offline.
    function newId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      // Fallback for browsers/contexts without randomUUID
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    }

    const nowIso = () => new Date().toISOString();

    // Add a new record. Returns its new ID.
    async function saveNew(table, fields) {
      const now = nowIso();
      const record = { id: newId(), created: now, updatedAt: now, syncStatus: "pending", deleted: false, ...fields };
      await table.add(record);
      updateSyncBadge();
      return record.id;
    }

    // Change fields on an existing record and flag it for upload again.
    async function changeRecord(table, id, changes) {
      await table.update(id, { ...changes, updatedAt: nowIso(), syncStatus: "pending" });
      updateSyncBadge();
    }

    // "Soft" delete: the record is flagged deleted rather than removed, so
    // the server can be told about it at the next sync. It cascades down
    // (assessment -> sections -> photos -> voice notes). The photo/audio
    // data is dropped straight away, so deleting still frees device space.
    async function softDelete(kind, id) {
      const mark  = { deleted: true, updatedAt: nowIso(), syncStatus: "pending" };
      const media = { ...mark, data: null };

      async function markPhoto(photoId) {
        await db.voiceNotes.where("photoId").equals(photoId).modify(media);
        await db.photos.update(photoId, media);
      }
      async function markSection(sectionId) {
        const photoIds = await db.photos.where("sectionId").equals(sectionId).primaryKeys();
        for (const pid of photoIds) await markPhoto(pid);
        await db.sections.update(sectionId, mark);
      }

      await db.transaction("rw", db.assessments, db.sections, db.photos, db.voiceNotes, async () => {
        if (kind === "assessment") {
          const sectionIds = await db.sections.where("assessmentId").equals(id).primaryKeys();
          for (const sid of sectionIds) await markSection(sid);
          await db.assessments.update(id, mark);
        } else if (kind === "section") {
          await markSection(id);
        } else if (kind === "photo") {
          await markPhoto(id);
        } else if (kind === "voiceNote") {
          await db.voiceNotes.update(id, media);
        }
      });
      updateSyncBadge();
    }

    // Small line at the bottom of the page: how many records are waiting.
    async function updateSyncBadge() {
      const badge = document.getElementById("sync-badge");
      if (!badge) return;
      const tables = [db.assessments, db.sections, db.photos, db.voiceNotes];
      const counts = await Promise.all(tables.map(t => t.where("syncStatus").equals("pending").count()));
      const total = counts.reduce((a, b) => a + b, 0);
      badge.textContent = total + " record(s) not yet synced";
    }

    // ===============================================================
    // 2. SMALL HELPERS
    // ===============================================================
    const app = document.getElementById("app");

    // el("button", {onclick: fn}, "Text")  builds an element in one line.
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") node.className = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value);
      }
      node.append(...children);
      return node;
    }

    const fmtDate = iso => new Date(iso).toLocaleString("en-GB");
    const fmtKB   = bytes => Math.round(bytes / 1024) + " KB";

    // Thumbnails use temporary URLs that point at the stored image data.
    // We keep a list so we can release them when the screen changes.
    let objectUrls = [];
    function releaseUrls() {
      objectUrls.forEach(u => URL.revokeObjectURL(u));
      objectUrls = [];
    }

    // ===============================================================
    // 3. TAGS
    // A starter pick-list of tappable tags, plus any custom tags the
    // assessor has added. Swap these defaults for the categories he
    // actually uses in his reports.
    // ===============================================================
    const DEFAULT_TAGS = [
      "fire door", "emergency lighting", "fire extinguisher", "escape route",
      "compartmentation", "alarm / detection", "signage", "electrical", "housekeeping"
    ];

    // Defaults first, then any custom tags saved earlier.
    async function getAllTags() {
      const custom = await db.customTags.toArray();
      const extras = custom.map(t => t.name).filter(n => !DEFAULT_TAGS.includes(n));
      return [...DEFAULT_TAGS, ...extras];
    }

    // Builds the collapsible tag area for one photo.
    // A Set is a list that can't hold duplicates - ideal for tags.
    function tagPanel(photo, allTags) {
      const selected = new Set(photo.tags || []);
      const summary = el("summary", {});
      const chipBox = el("div", { class: "chips" });
      const customInput = el("input", { type: "text", placeholder: "Add your own tag" });

      async function saveSelected() {
        await changeRecord(db.photos, photo.id, { tags: [...selected] });
      }

      // Redraws the summary line and the row of buttons.
      function refresh() {
        summary.textContent = selected.size ? "Tags: " + [...selected].join(", ") : "Add tags";
        chipBox.replaceChildren();
        for (const tag of allTags) {
          chipBox.append(el("button", {
            class: "chip",
            "aria-pressed": String(selected.has(tag)),   // the CSS colours it when "true"
            onclick: async () => {
              if (selected.has(tag)) selected.delete(tag); else selected.add(tag);
              await saveSelected();
              refresh();
            }
          }, tag));
        }
      }

      async function addCustom() {
        const name = customInput.value.trim().toLowerCase();
        if (!name) return;
        if (!allTags.includes(name)) {
          await db.customTags.put({ name });   // remember it for future photos
          allTags.push(name);
        }
        selected.add(name);
        await saveSelected();
        customInput.value = "";
        refresh();
      }

      refresh();
      return el("details", {}, summary, chipBox, customInput, el("button", { onclick: addCustom }, "Add tag"));
    }

    // ===============================================================
    // 3b. TYPED NOTE AND VOICE NOTES
    // ===============================================================

    // Seconds -> "m:ss"
    function fmtDuration(seconds) {
      const s = Math.round(seconds);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    // Different browsers record in different formats (Chrome/Android: WebM,
    // Safari/iPhone: MP4). Ask the browser which one it supports.
    function pickMimeType() {
      const options = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      if (!window.MediaRecorder) return "";
      return options.find(t => MediaRecorder.isTypeSupported(t)) || "";
    }

    // Only one recording at a time. Kept here so we can stop it if the
    // user navigates away.
    let activeRecorder = null;

    // Opens the microphone and starts recording. When stopped, calls
    // onDone(blob, seconds) with the finished audio.
    async function startRecording(onDone) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = pickMimeType();
      const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
      const chunks = [];
      const startedAt = Date.now();

      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());   // switches the microphone off
        activeRecorder = null;
        const type = recorder.mimeType || mimeType || "audio/webm";
        onDone(new Blob(chunks, { type }), (Date.now() - startedAt) / 1000);
      };

      recorder.start();
      activeRecorder = recorder;
      return recorder;
    }

    // Typed note: saved when the box loses focus.
    function noteBox(photo) {
      const box = el("textarea", { placeholder: "Typed note (optional)" });
      box.value = photo.note || "";
      box.addEventListener("change", () => changeRecord(db.photos, photo.id, { note: box.value.trim() }));
      return box;
    }

    // Record button plus the list of saved voice notes for one photo.
    function voicePanel(photo) {
      const list = el("div", {});
      const status = el("div", { class: "muted" });
      const recBtn = el("button", { class: "btn" }, "Record voice note");
      let timer = null;

      async function renderNotes() {
        const notes = await db.voiceNotes.where("photoId").equals(photo.id).filter(x => !x.deleted).sortBy("created");
        list.replaceChildren();
        for (const n of notes) {
          const url = URL.createObjectURL(new Blob([n.data], { type: n.mimeType }));
          objectUrls.push(url);
          list.append(el("div", {},
            el("audio", { controls: "", src: url, preload: "metadata" }),
            el("div", { class: "muted" }, fmtDuration(n.duration) + " - " + fmtKB(n.size)),
            el("button", { class: "link-btn", onclick: async () => {
              if (!confirm("Delete this voice note?")) return;
              await softDelete("voiceNote", n.id);
              renderNotes();
            } }, "Delete voice note")
          ));
        }
      }

      function resetButton() {
        clearInterval(timer);
        recBtn.textContent = "Record voice note";
        recBtn.classList.remove("recording");
      }

      recBtn.addEventListener("click", async () => {
        if (activeRecorder) {
          // Already recording. If it's this button's recording, stop it.
          if (recBtn.classList.contains("recording")) activeRecorder.stop();
          else status.textContent = "Stop the other recording first.";
          return;
        }
        status.textContent = "";
        try {
          await startRecording(async (blob, seconds) => {
            resetButton();
            await saveNew(db.voiceNotes, {
              photoId: photo.id,
              data: await blob.arrayBuffer(),   // the audio's bytes
              size: blob.size,
              mimeType: blob.type,     // remember the format with each recording
              duration: seconds        // our own timer; browser-made files often lack this
            });
            // Short pause: iPhones need a moment to switch from "recording"
            // back to "playback" mode, or the first playback can be silent.
            await new Promise(r => setTimeout(r, 400));
            renderNotes();
          });
          const started = Date.now();
          recBtn.classList.add("recording");
          recBtn.textContent = "Stop recording (0:00)";
          timer = setInterval(() => {
            recBtn.textContent = "Stop recording (" + fmtDuration((Date.now() - started) / 1000) + ")";
          }, 500);
        } catch (err) {
          console.error(err);
          status.textContent = "Can't use the microphone: " + err.message +
            " (Allow microphone access, and note the page must be on HTTPS or localhost.)";
        }
      });

      renderNotes();
      return el("div", { class: "voice" }, recBtn, status, list);
    }

    // ===============================================================
    // 3c. IMAGE RESIZING
    // Takes the full phone photo, scales it down so the longest side
    // is 1600px, and re-saves it as a JPEG at 75% quality.
    // A 5MB photo usually becomes 200-500KB.
    // ===============================================================
    async function resizeImage(file, maxEdge = 1600, quality = 0.75) {
      // imageOrientation stops phone photos appearing sideways
      const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });

      const scale  = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
      const width  = Math.round(bitmap.width * scale);
      const height = Math.round(bitmap.height * scale);

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
      bitmap.close();

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
      return { blob, width, height };
    }

    // ===============================================================
    // 4. SCREENS
    // The page "address" (the part after the #) decides which one shows:
    //   #/          home: list of assessments
    //   #/a/5       assessment 5: its sections
    //   #/s/12      section 12: its photos
    // Using addresses means the phone's Back button works for free.
    // ===============================================================

    // ---- Home: assessments ----
    async function showHome() {
      const nameInput = el("input", { type: "text", id: "name", placeholder: "Building / location, e.g. Riverside House, Solihull" });

      async function create() {
        const name = nameInput.value.trim();
        if (!name) return;
        const id = await saveNew(db.assessments, { name });
        location.hash = "#/a/" + id;   // jump straight into the new assessment
      }

      const list = el("ul", { class: "items" });
      const all = await db.assessments.orderBy("created").reverse().filter(a => !a.deleted).toArray();
      if (all.length === 0) list.append(el("li", {}, "No assessments yet."));

      for (const a of all) {
        const sectionCount = await db.sections.where("assessmentId").equals(a.id).filter(x => !x.deleted).count();
        list.append(el("li", {},
          el("a", { href: "#/a/" + a.id }, a.name),
          el("div", { class: "muted" }, fmtDate(a.created) + " - " + sectionCount + " section(s)"),
          el("button", { class: "link-btn", onclick: () => deleteAssessment(a) }, "Delete")
        ));
      }

      app.replaceChildren(
        el("h1", {}, "Assessments"),
        nameInput,
        el("button", { onclick: create }, "Start new assessment"),
        list
      );
    }

    async function deleteAssessment(a) {
      if (!confirm("Delete '" + a.name + "' and everything in it?")) return;
      await softDelete("assessment", a.id);
      showHome();
    }

    // ---- Assessment: sections ----
    async function showAssessment(id) {
      const assessment = await db.assessments.get(id);
      if (!assessment || assessment.deleted) { location.hash = "#/"; return; }

      const nameInput = el("input", { type: "text", placeholder: "Section, e.g. Stairwell B, Main electrical panel" });

      async function addSection() {
        const name = nameInput.value.trim();
        if (!name) return;
        const sid = await saveNew(db.sections, { assessmentId: id, name });
        location.hash = "#/s/" + sid;  // straight into the new section, ready for photos
      }

      const list = el("ul", { class: "items" });
      const sections = await db.sections.where("assessmentId").equals(id).filter(x => !x.deleted).sortBy("created");
      if (sections.length === 0) list.append(el("li", {}, "No sections yet."));

      for (const s of sections) {
        const photoCount = await db.photos.where("sectionId").equals(s.id).filter(x => !x.deleted).count();
        list.append(el("li", {},
          el("a", { href: "#/s/" + s.id }, s.name),
          el("div", { class: "muted" }, photoCount + " photo(s)"),
          el("button", { class: "link-btn", onclick: () => deleteSection(s) }, "Delete")
        ));
      }

      app.replaceChildren(
        el("a", { href: "#/", class: "back" }, "< All assessments"),
        el("h1", {}, assessment.name),
        el("p", { class: "muted" }, fmtDate(assessment.created)),
        nameInput,
        el("button", { onclick: addSection }, "Add section"),
        list
      );
    }

    async function deleteSection(s) {
      if (!confirm("Delete '" + s.name + "' and its photos?")) return;
      await softDelete("section", s.id);
      showAssessment(s.assessmentId);
    }

    // ---- Section: photos ----
    async function showSection(id) {
      const section = await db.sections.get(id);
      if (!section || section.deleted) { location.hash = "#/"; return; }

      const status = el("p", { class: "muted" }, "");

      // Hidden file input. On a phone, capture="environment" opens the
      // rear camera directly. On a PC it opens a file picker instead,
      // which is handy for testing.
      const input = el("input", { type: "file", accept: "image/*", capture: "environment", id: "photo-input" });
      input.addEventListener("change", async () => {
        const file = input.files[0];
        if (!file) return;
        status.textContent = "Processing photo...";
        try {
          const { blob, width, height } = await resizeImage(file);
          await saveNew(db.photos, {
            sectionId: id,
            data: await blob.arrayBuffer(),   // the photo's bytes
            mimeType: blob.type,
            size: blob.size,
            width, height,
            tags: [],       // filled in by the tag buttons
            note: ""        // the typed note
          });
          status.textContent = "Saved (" + fmtKB(file.size) + " reduced to " + fmtKB(blob.size) + ").";
        } catch (err) {
          console.error(err);
          status.textContent = "Could not save photo: " + err.message;
        }
        input.value = "";           // lets the same file be chosen again
        renderPhotos();
      });

      const grid = el("ul", { class: "grid" });

      async function renderPhotos() {
        releaseUrls();
        grid.replaceChildren();
        const photos = await db.photos.where("sectionId").equals(id).filter(x => !x.deleted).sortBy("created");
        const allTags = await getAllTags();
        if (photos.length === 0) grid.append(el("li", {}, "No photos yet."));

        for (const p of photos) {
          const url = URL.createObjectURL(new Blob([p.data], { type: p.mimeType }));
          objectUrls.push(url);
          grid.append(el("li", {},
            el("img", { src: url, alt: "Photo taken " + fmtDate(p.created) }),
            el("div", { class: "muted" }, fmtDate(p.created) + " - " + fmtKB(p.size)),
            tagPanel(p, allTags),
            noteBox(p),
            voicePanel(p),
            el("button", { class: "link-btn", onclick: async () => {
              if (!confirm("Delete this photo?")) return;
              await softDelete("photo", p.id);
              renderPhotos();
            } }, "Delete")
          ));
        }
      }

      app.replaceChildren(
        el("a", { href: "#/a/" + section.assessmentId, class: "back" }, "< Back to sections"),
        el("h1", {}, section.name),
        input,
        el("label", { class: "btn", for: "photo-input" }, "Take photo"),
        status,
        grid
      );
      renderPhotos();
    }

    // ===============================================================
    // 5. ROUTER
    // Reads the address after the # and shows the matching screen.
    // ===============================================================
    async function route() {
      if (activeRecorder) activeRecorder.stop();   // saves it and switches the mic off
      releaseUrls();
      const parts = location.hash.replace(/^#\/?/, "").split("/");   // "a/5" -> ["a", "5"]
      const [kind, rawId] = parts;
      const id = rawId;   // IDs are text (UUIDs) now, so no Number()

      try {
        if (kind === "a" && id) await showAssessment(id);
        else if (kind === "s" && id) await showSection(id);
        else await showHome();
      } catch (err) {
        console.error(err);
        app.replaceChildren(el("p", {}, "Something went wrong: " + err.message));
      }
      updateSyncBadge();
    }

    // Register the service worker so the app can open offline.
    // Only works over HTTPS (or localhost), not from a file on disk.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.error("Service worker failed:", err));
      });
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
